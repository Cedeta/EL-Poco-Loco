<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/small-chicken.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/status-bar-health.class.js"></script>
    <script src="./models/status-bar-bottle.class.js"></script>
    <script src="./models/status-bar-coin.class.js"></script>
    <script src="./models/status-bar-endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./levels/level1.js"></script>

    <script src="./js/game.js"></script>
</head>

<body onload="init()">
    <!-- <h1>EL POLLO LOCO</h1> -->
    <div id="game-container">
      <canvas id="canvas" width="720" height="480"></canvas>
      <div id="start-overlay">
        <img
          id="start-screen-img"
          src="./assets/img/9_intro_outro_screens/start/startscreen_1.png"
          alt="Startscreen"
        />
        <button id="start-button" onclick="startGame()">
          START
        </button>
        <img
            id="sound-toggle"
            src="./assets/img/icons/volume.png"
            alt="Sound an/aus"
            onclick="toggleSound()"
         />
         <img
            id="fullscreen-toggle"
            src="./assets/img/icons/fullscreen.png"
            alt="Fullscreen an/aus"
            onclick="toggleFullscreen()"
         />

<button id="howto-button" onclick="openHowto()">Anleitung</button>
<div id="howto-overlay" style="display:none;">
  <div id="howto-modal">
    <button id="howto-back" class="gameover-btn" onclick="closeHowto()">Zurück</button>
    <h2 class="howto-title">Steuerung</h2>
    <div class="howto-grid">
      <div class="howto-row"><span class="howto-key">← / →</span><span class="howto-text">Laufen</span></div>
      <div class="howto-row"><span class="howto-key">↑</span><span class="howto-text">Springen</span></div>
      <div class="howto-row"><span class="howto-key">Space</span><span class="howto-text">Flasche werfen</span></div>
      <div class="howto-row"><span class="howto-key">P</span><span class="howto-text">Pause</span></div>
    </div>
    <h2 class="howto-title">Mobil</h2>
    <div class="howto-grid">
      <div class="howto-row"><span class="howto-key">Links</span><span class="howto-text">Bewegung (Steuerkreuz)</span></div>
      <div class="howto-row"><span class="howto-key">Rechts</span><span class="howto-text">Oben Werfen / Unten Springen</span></div>
    </div>
  </div>
</div>

      </div>
      <div id="gameover-overlay" style="display:none;">
        <img
          id="gameover-img"
          src="./assets/img/9_intro_outro_screens/game_over/game over.png"
          alt="Game Over"
        />
        <div id="gameover-buttons">
            <button class="gameover-btn" onclick="backToMenu()">Zum Startmenu</button>
            <button class="gameover-btn" onclick="restartGame()">Neu starten</button>
          </div>
      </div>
      <div id="win-overlay" style="display:none;">
        <img
          id="win-img"
          src="./assets/img/9_intro_outro_screens/win/win_2.png"
          alt="You Win"
        />
        <div id="win-buttons">
          <button class="gameover-btn" onclick="backToMenuFromWin()">Zum Startmenu</button>
          <button class="gameover-btn" onclick="restartGameFromWin()">Neu starten</button>
        </div>
      </div>
      <div id="pause-overlay" style="display:none;">
        <div id="pause-modal">
          <div id="pause-title">PAUSE</div>
          <div id="pause-hint">Drücke <b>P</b> zum Fortsetzen</div>
          <div id="pause-buttons">
            <button class="gameover-btn"  onclick="resumeGame()">Weiter</button>
            <button class="gameover-btn" onclick="backToMenu()">Zum Startmenu</button>
          </div>
        </div>
      </div>
      <div id="mobile-controls" aria-hidden="true">
        <div id="dpad">
          <button class="dpad-btn" id="dpad-left">◀</button>
          <button class="dpad-btn" id="dpad-right">▶</button>
        </div>
        <div id="pause-button">
          <button class="action-btn" id="btn-pause" onclick="togglePauseUI()">Pause</button>
        </div>
        <div id="action-buttons">
          <button class="action-btn" id="btn-throw">Werfen</button>
          <button class="action-btn" id="btn-jump">Springen</button>
        </div>
      </div>
    </div>

    <div id="rotate-overlay">
      <img
        id="rotate-icon"
        src="./assets/img/icons/rotate-smartphone.png"
        alt="Bitte Smartphone drehen"
      />
      <div id="rotate-text">Bitte Gerät drehen</div>
    </div>

    <footer class="bg-credit" style="display:none;">
      Image by
      <a href="https://pixabay.com/users/pexels-2286921/?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=1866541" target="_blank" rel="noopener noreferrer">Pexels</a>
      from
      <a href="https://pixabay.com/?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=1866541" target="_blank" rel="noopener noreferrer">Pixabay</a>
    </footer>
  </body>

</html>
