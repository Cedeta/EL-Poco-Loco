<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/small-chicken.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/status-bar-health.class.js"></script>
    <script src="./models/status-bar-bottle.class.js"></script>
    <script src="./models/status-bar-coin.class.js"></script>
    <script src="./models/status-bar-endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./levels/level1.js"></script>

    <script src="./js/game.js"></script>
</head>

<body onload="init()">
    <h1>EL POLLO LOCO</h1>
    <div id="game-container">
      <canvas id="canvas" width="720" height="480"></canvas>
      <div id="start-overlay">
        <img
          id="start-screen-img"
          src="./assets/img/9_intro_outro_screens/start/startscreen_1.png"
          alt="Startscreen"
        />
        <button id="start-button" onclick="startGame()">
          START
        </button>
        <img
            id="sound-toggle"
            src="./assets/img/icons/volume.png"
            alt="Sound an/aus"
            onclick="toggleSound()"
/>
      </div>
      <div id="gameover-overlay" style="display:none;">
        <img
          id="gameover-img"
          src="./assets/img/9_intro_outro_screens/game_over/game over.png"
          alt="Game Over"
        />
        <div id="gameover-buttons">
            <button class="gameover-btn" onclick="backToMenu()">Zum Startmenu</button>
            <button class="gameover-btn" onclick="restartGame()">Neu starten</button>
          </div>
      </div>
      <div id="win-overlay" style="display:none;">
        <img
          id="win-img"
          src="./assets/img/9_intro_outro_screens/win/win_2.png"
          alt="You Win"
        />
        <div id="win-buttons">
          <button class="gameover-btn" onclick="backToMenuFromWin()">Zum Startmenu</button>
          <button class="gameover-btn" onclick="restartGameFromWin()">Neu starten</button>
        </div>
      </div>
    </div>
  </body>

</html>
